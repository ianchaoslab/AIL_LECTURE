<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 올인원 메모장</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 시작 화면: 문구는 여기서 바꾸세요 -->
  <section id="start-screen" class="start-screen">
    <h1>📝 AI 올인원 메모장</h1>
    <p>메모를 적고, 나중에 할 일과 일정, 알림까지 한 곳에서.</p>
    <button id="start-btn" type="button" class="primary big">시작하기</button>
  </section>

  <div id="app" hidden>
  <header class="topbar">
    <h1>📝 메모장</h1>
    <button id="new-btn" type="button">+ 새 메모</button>
  </header>

  <main class="layout">
    <!-- 왼쪽: 메모 목록 -->
    <aside class="list-panel">
      <ul id="memo-list" aria-label="메모 목록"></ul>
      <p id="empty-msg" class="empty" hidden>아직 메모가 없어요. 오른쪽에 바로 적어 보세요.</p>
    </aside>

    <!-- 오른쪽: 입력 영역 -->
    <section class="editor-panel">
      <!-- 안내 문구는 PRD 7-1 기준. 바꾸고 싶으면 이 글자만 고치세요. -->
      <p class="notice">⚠️ 주민등록번호, 계좌번호, 비밀번호 등 민감한 정보는 적지 마세요.</p>

      <input id="title-input" type="text" placeholder="제목" maxlength="100" autocomplete="off">
      <textarea id="body-input" placeholder="내용을 적어 보세요"></textarea>

      <div class="actions">
        <button id="save-btn" type="button" class="primary">저장</button>
        <button id="delete-btn" type="button" class="danger" hidden>삭제</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <p id="time-info" class="time-info"></p>
    </section>
  </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
